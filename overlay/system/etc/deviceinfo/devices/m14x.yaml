m14x:
  Vendor: Samsung
  PrettyName: Samsung M14 5G
  DeviceType: phone
  GridUnit: 22
  supportsRebootToRecovery: true
  SupportedOrientations:
    - Portrait
    - Landscape
    - InvertedLandscape

  # Telephony (ofono-binder)
  OfonoPlugin: binder
  OfonoImplementsIms: true
  
  FlashlightSysfsPath:
    - /sys/devices/virtual/camera/flash/rear_flash

  # Mir / SurfaceFlinger rendering flags for Exynos Mali GPU
  MirAndroidPlatformClientEglFlush: "all"
  MirAndroidPlatformServerEglSync: false
  MirAndroidPlatformServerPartialUpdates: false
  VibrateDurationExtraMs: 30
  XwaylandShm: true

  # Repowered
  BacklightSysfsPath: "/sys/class/backlight/panel"
