#
# uMTP Responder config file
# Generated directly from device properties (Samsung Galaxy M14 5G)
#

# UBports settings
show_hidden_files 0

# Phablet user UID & GID from 'id phablet'
default_uid 32011
default_gid 32011

# Internal Storage target
storage "/home/phablet" "Internal Storage" "rw,locked"

# USB Device Strings
manufacturer "samsung"
product "SM-M146B"
serial "RQCWB08M9AA"

# Firmware & Interface metadata
firmware_version "13"
interface "MTP"

# Hardware Identifiers from ConfigFS
usb_vendor_id  0x04e8
usb_product_id 0x6860
usb_class 0x06
usb_subclass 0x01
usb_protocol 0x01

# bcdDevice version from /sys/kernel/config/usb_gadget/g1/bcdDevice
usb_dev_version 0x0515

# Generic FunctionFS Mode
usb_functionfs_mode 0x1

# Endpoints matching active mount /dev/usb-ffs/mtp
usb_dev_path   "/dev/usb-ffs/mtp/ep0"
usb_epin_path  "/dev/usb-ffs/mtp/ep1"
usb_epout_path "/dev/usb-ffs/mtp/ep2"
usb_epint_path "/dev/usb-ffs/mtp/ep3"

# bcdUSB (High-Speed packet size: 512 bytes)
usb_max_packet_size 0x0200
